name: Deploy to GitHub Pages

# One-time setup in the repo: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the public Supabase URL and key come from .env, so this is a cloud-mode build
      - run: npm run build
      - name: Serve deep links (/taskflow/board, …) with the app
        run: |
          cp dist/index.html dist/404.html
          if [ -d docs/screenshots ]; then mkdir -p dist/docs && cp -r docs/screenshots dist/docs/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
